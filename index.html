<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Download · Khichi Ittihad Pakistan</title>
<link rel="icon" href="https://i.ibb.co/67BKfCHD/Screenshot-20260722-231112.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#0B4F3C;
  --emerald-dark:#073226;
  --emerald-soft:#0E5F48;
  --gold:#C89B3C;
  --gold-soft:#E4C877;
  --paper:#FAF7F0;
  --sand:#EFE8D8;
  --ink:#1B2420;
  --ink-soft:#5B6660;
  --brick:#B5462F;
  --line:#DCD3BD;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(165deg, var(--emerald-dark) 0%, var(--emerald) 45%, #0a3d30 100%);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  -webkit-tap-highlight-color:transparent;
}
.card{
  width:100%;
  max-width:380px;
  background:var(--paper);
  border-radius:24px;
  padding:36px 28px 28px;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg, var(--gold), var(--gold-soft), var(--gold));
}
.logo{
  width:96px;height:96px;
  border-radius:22px;
  object-fit:cover;
  border:3px solid var(--gold);
  box-shadow:0 8px 24px rgba(11,79,60,.25);
  display:block;
  margin:0 auto 18px;
  background:#fff;
}
.app-name{
  font-family:'Amiri',serif;
  font-size:26px;
  font-weight:700;
  color:var(--emerald-dark);
  line-height:1.25;
  margin:0 0 4px;
}
.app-tag{
  font-size:12px;
  font-weight:600;
  color:var(--gold);
  letter-spacing:.6px;
  text-transform:uppercase;
  margin-bottom:22px;
}
.headline{
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:20px;
  line-height:1.45;
}
.dl-btn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:16px 18px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(180deg, var(--gold) 0%, #b8892e 100%);
  color:var(--emerald-dark);
  box-shadow:0 8px 20px -6px rgba(200,155,60,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:transform .15s ease, opacity .2s;
}
.dl-btn:active{transform:scale(.97);}
.dl-btn:disabled{opacity:.65;pointer-events:none;}
.dl-btn .icon{font-size:20px;line-height:1;}
.size-hint{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:10px;
  min-height:18px;
}
.size-hint.ready{color:var(--emerald);font-weight:600;}
.size-hint.error{color:var(--brick);font-weight:600;}
.android-note{
  margin-top:22px;
  font-size:13.5px;
  font-weight:600;
  color:var(--emerald-dark);
  letter-spacing:.2px;
}
.divider{
  height:1px;
  background:var(--line);
  margin:22px 0 16px;
}
.dev-line{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-bottom:12px;
  line-height:1.4;
}
.dev-line strong{color:var(--emerald-dark);}
.contact-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:transparent;
  border:1.5px solid var(--emerald);
  color:var(--emerald);
  border-radius:999px;
  padding:8px 16px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  transition:background .15s, color .15s;
}
.contact-btn:active{background:var(--emerald);color:#fff;}
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--emerald-dark);color:#fff;
  padding:12px 18px;border-radius:999px;
  font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .3s;
  z-index:50;border:1px solid var(--gold);
  max-width:88%;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:var(--brick);}
.spinner{
  width:18px;height:18px;border:2.5px solid rgba(11,79,60,.25);
  border-top-color:var(--emerald-dark);border-radius:50%;
  animation:spin .7s linear infinite;display:none;
}
.dl-btn.loading .spinner{display:block;}
.dl-btn.loading .btn-text{opacity:.5;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="card">
  <img class="logo" src="https://i.ibb.co/67BKfCHD/Screenshot-20260722-231112.png" alt="Khichi Ittihad Logo">

  <h1 class="app-name">Khichi Ittihad Pakistan</h1>
  <div class="app-tag">Official Application</div>

  <p class="headline">Official App — Download Now</p>

  <button class="dl-btn" id="downloadBtn" onclick="startDownload()">
    <span class="icon">⬇️</span>
    <span class="btn-text" id="btnText">Download APK</span>
    <span class="spinner"></span>
  </button>
  <div class="size-hint" id="sizeHint">Checking file…</div>

  <p class="android-note">Android App download now 👆</p>

  <div class="divider"></div>

  <p class="dev-line">Developed by <strong>MrCrazy Digital Company</strong></p>
  <a class="contact-btn" href="https://mrcrazyteamofficial-lab.github.io/Custmer/" target="_blank" rel="noopener">
    💬 Contact Developer
  </a>
</div>

<div class="toast" id="toast"></div>

<script>
/* APK path — put K.I.P.apk inside /assets/ folder next to this HTML */
const APK_PATHS = [
  "assets/K.I.P.apk",
  "assets/KIP.apk",
  "K.I.P.apk",
  "KIP.apk"
];

const $ = (id) => document.getElementById(id);

function showToast(msg, isError){
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

function formatMB(bytes){
  if(!bytes || bytes <= 0) return null;
  const mb = bytes / (1024 * 1024);
  return mb >= 10 ? mb.toFixed(1) + " MB" : mb.toFixed(2) + " MB";
}

let foundApk = null; // { url, size }

async function detectApk(){
  const hint = $("sizeHint");
  const btn = $("downloadBtn");
  btn.disabled = true;
  hint.textContent = "Checking file…";
  hint.className = "size-hint";

  for(const path of APK_PATHS){
    try{
      const res = await fetch(path, { method: "HEAD", cache: "no-store" });
      if(res.ok){
        const len = res.headers.get("Content-Length");
        const size = len ? Number(len) : 0;
        foundApk = { url: path, size };
        const mb = formatMB(size);
        hint.textContent = mb ? ("Ready · " + mb) : "Ready to download";
        hint.className = "size-hint ready";
        btn.disabled = false;
        $("btnText").textContent = mb ? ("Download APK · " + mb) : "Download APK";
        return;
      }
    }catch(e){ /* try next */ }
  }

  // Fallback: try GET range to confirm existence without full download
  for(const path of APK_PATHS){
    try{
      const res = await fetch(path, {
        method: "GET",
        headers: { "Range": "bytes=0-0" },
        cache: "no-store"
      });
      if(res.ok || res.status === 206){
        const range = res.headers.get("Content-Range");
        let size = 0;
        if(range){
          const m = range.match(/\/(\d+)$/);
          if(m) size = Number(m[1]);
        } else {
          const len = res.headers.get("Content-Length");
          if(len) size = Number(len);
        }
        foundApk = { url: path, size };
        const mb = formatMB(size);
        hint.textContent = mb ? ("Ready · " + mb) : "Ready to download";
        hint.className = "size-hint ready";
        btn.disabled = false;
        $("btnText").textContent = mb ? ("Download APK · " + mb) : "Download APK";
        return;
      }
    }catch(e){}
  }

  foundApk = null;
  hint.textContent = "APK not found in assets";
  hint.className = "size-hint error";
  btn.disabled = false;
  $("btnText").textContent = "Download APK";
}

function startDownload(){
  if(!foundApk){
    showToast("Error: K.I.P.apk assets mein nahi mili", true);
    $("sizeHint").textContent = "APK not found — upload assets/K.I.P.apk";
    $("sizeHint").className = "size-hint error";
    return;
  }

  const btn = $("downloadBtn");
  btn.classList.add("loading");
  btn.disabled = true;

  // Trigger real file download
  const a = document.createElement("a");
  a.href = foundApk.url;
  a.download = "K.I.P.apk";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  const mb = formatMB(foundApk.size);
  showToast(mb ? ("Download started · " + mb) : "Download started");

  setTimeout(() => {
    btn.classList.remove("loading");
    btn.disabled = false;
  }, 1500);
}

// Detect on load
detectApk();
</script>
</body>
  </html>
